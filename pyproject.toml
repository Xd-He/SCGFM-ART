[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "scgfm-art"
version = "1.0.0"
description = "Amortized Relational Transport for Structure-Centric Graph Foundation Models"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
  { name = "Xiaodong He" },
  { name = "Xincheng Wang" },
  { name = "Zhao Kang" },
]
dependencies = [
  "torch>=2.2",
  "torch-geometric>=2.5",
  "numpy>=1.24",
  "tqdm>=4.66",
  "matplotlib>=3.7",
  "ogb>=1.3.6",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
scgfm-art-graph = "scripts.run_graph_classification:main"
scgfm-art-prepare-node-data = "scripts.prepare_node_data:main"
scgfm-art-node = "scripts.run_node_classification:main"

[tool.setuptools.packages.find]
include = ["scgfm_art*", "scripts*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
